<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="favWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="favWallShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <!-- Atap Mode Terang Default: Charcoal Anthracite & Steel Slate -->
    <linearGradient id="favRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="favBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favDoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    .fav-roof { fill: url(#favRoof); stroke: #475569; stroke-width: 3; }
    .fav-roof-lip { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .fav-roof { fill: #ffffff !important; stroke: none !important; }
      .fav-roof-lip { fill: #cbd5e1 !important; }
    }
  </style>

  <!-- Bayangan Lantai -->
  <ellipse cx="256" cy="466" rx="200" ry="16" fill="#000000" opacity="0.25" />

  <!-- Dinding Gudang -->
  <path fill="url(#favWall)" d="M 110 130 v 332 h 312 V 130 z" />
  <path fill="url(#favWallShadow)" d="M 382 130 v 332 h 40 V 130 z" />

  <!-- Atap Arsitektural (Adaptif Mode Terang / Gelap) -->
  <path class="fav-roof-lip" d="M 256 32 L 24 160 h 60 v 20 H 44 L 256 64 l 212 116 h -40 v -20 h 60 L 256 32 z" />
  <path class="fav-roof" d="M 44 180 a 20 20 0 0 1 -10 -37 l 222 -122 a 20 20 0 0 1 19 0 l 222 122 a 20 20 0 0 1 -19 35 L 256 68 L 64 174 a 20 20 0 0 1 -20 6 z" />

  <!-- Ventilasi -->
  <rect fill="#1e3a8a" x="200" y="160" width="40" height="15" rx="7.5" />
  <rect fill="#1e3a8a" x="272" y="160" width="40" height="15" rx="7.5" />

  <!-- Pintu Gulung Industri -->
  <rect fill="url(#favDoor)" x="180" y="220" width="152" height="242" rx="14" stroke="#475569" stroke-width="3" />
  <path fill="#f8fafc" d="M 180 220 h 152 v 50 H 180 z" opacity="0.9" />

  <!-- Kotak Material Besar -->
  <rect fill="url(#favBox)" x="60" y="300" width="120" height="162" rx="12" />
  <rect fill="#b45309" x="160" y="300" width="20" height="162" rx="4" />
  <path fill="#fef08a" d="M 100 300 h 40 v 48 l -20 14 l -20 -14 z" />

  <!-- Kotak Material Kecil -->
  <rect fill="url(#favBox)" x="180" y="350" width="90" height="112" rx="10" />
  <rect fill="#b45309" x="250" y="350" width="20" height="112" rx="4" />
  <path fill="#fef08a" d="M 210 350 h 30 v 34 l -15 10 l -15 -10 z" />
</svg>
