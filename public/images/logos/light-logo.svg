<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <!-- Gradien Dinding Gudang (Royal Cobalt) -->
    <linearGradient id="llWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="llWallShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <!-- Gradien Atap Putih Arsitektural untuk Mode Gelap -->
    <linearGradient id="llRoofTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="llRoofFascia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <!-- Gradien Kotak Material (Warm Amber) -->
    <linearGradient id="llBoxMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="llBoxShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <!-- Pintu Gulung Baja Industri -->
    <linearGradient id="llDoorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Ikon Gudang Refined (Skala Proporsional) -->
  <g transform="translate(4, 2) scale(0.174)">
    <ellipse cx="256" cy="466" rx="210" ry="16" fill="#000000" opacity="0.35" />
    <path fill="url(#llWallGrad)" d="M 110 130 v 332 h 312 V 130 z" rx="6" />
    <path fill="url(#llWallShadow)" d="M 382 130 v 332 h 40 V 130 z" />
    <path fill="url(#llRoofFascia)" d="M 256 32 L 24 160 h 60 v 20 H 44 L 256 64 l 212 116 h -40 v -20 h 60 L 256 32 z" />
    <path fill="url(#llRoofTop)" d="M 44 180 a 20 20 0 0 1 -10 -37 l 222 -122 a 20 20 0 0 1 19 0 l 222 122 a 20 20 0 0 1 -19 35 L 256 68 L 64 174 a 20 20 0 0 1 -20 6 z" />
    <rect fill="#1e3a8a" x="200" y="160" width="40" height="15" rx="7.5" opacity="0.9" />
    <rect fill="#1e3a8a" x="272" y="160" width="40" height="15" rx="7.5" opacity="0.9" />
    <rect fill="url(#llDoorGrad)" x="180" y="220" width="152" height="242" rx="14" stroke="#475569" stroke-width="2" />
    <path fill="#f8fafc" d="M 180 220 h 152 v 56 H 180 z" opacity="0.95" />
    <path fill="#cbd5e1" d="M 180 220 h 152 v 18 H 180 z" />
    <line x1="184" y1="310" x2="328" y2="310" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="340" x2="328" y2="340" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="370" x2="328" y2="370" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <rect fill="url(#llBoxMain)" x="60" y="300" width="120" height="162" rx="12" />
    <rect fill="url(#llBoxShadow)" x="160" y="300" width="20" height="162" rx="4" />
    <path fill="#fef08a" d="M 100 300 h 40 v 48 l -20 14 l -20 -14 z" />
    <rect fill="url(#llBoxShadow)" x="80" y="390" width="60" height="14" rx="7" />
    <rect fill="url(#llBoxShadow)" x="80" y="420" width="60" height="14" rx="7" />
    <rect fill="url(#llBoxMain)" x="180" y="350" width="90" height="112" rx="10" />
    <rect fill="url(#llBoxShadow)" x="250" y="350" width="20" height="112" rx="4" />
    <path fill="#fef08a" d="M 210 350 h 30 v 34 l -15 10 l -15 -10 z" />
    <rect fill="url(#llBoxShadow)" x="195" y="410" width="45" height="11" rx="5.5" />
    <rect fill="url(#llBoxShadow)" x="195" y="435" width="45" height="11" rx="5.5" />
  </g>

  <!-- Tipografi: Kontras Terang untuk Dark Mode, Bebas Clipping -->
  <text x="94" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="38" letter-spacing="-0.6" fill="#f8fafc">Warehouse<tspan font-weight="900" fill="#60a5fa">MTMS</tspan></text>
  <text x="96" y="73" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="2.8" fill="#94a3b8">TRANSACTION MONITORING</text>
</svg>
